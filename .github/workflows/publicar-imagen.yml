name: Publicar imagen Docker

# Se ejecuta cada vez que cambia algo dentro de app/ en la rama main,
# o a mano desde la pestaña Actions (botón "Run workflow").
on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Avisar si todavía no hay Dockerfile
        if: hashFiles('app/Dockerfile') == ''
        run: echo "::notice::Todavía no hay app/Dockerfile. Escríbelo en el Paso 3 y haz push; la imagen se publicará sola."

      - name: Calcular el nombre de la imagen (en minúsculas)
        if: hashFiles('app/Dockerfile') != ''
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GitHub Container Registry
        if: hashFiles('app/Dockerfile') != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir la imagen con app/Dockerfile y publicarla
        if: hashFiles('app/Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.run_number }}
